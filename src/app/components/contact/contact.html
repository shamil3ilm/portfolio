<section class="contact" id="contact">
    <div class="container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2 class="section-title left">Let's Connect</h2>
                <p class="contact-text">
                    I'm currently available for freelance work or full-time opportunities.
                    If you have a project that needs some creative touch, let's chat!
                </p>
                <div class="contact-details">
                    <div class="detail-item">
                        <span class="icon">📧</span>
                        <a href="mailto:hello@example.com">hello@example.com</a>
                    </div>
                    <div class="detail-item">
                        <span class="icon">📍</span>
                        <span>New York, NY</span>
                    </div>
                </div>
                <div class="socials">
                    <a href="#" (click)="$event.preventDefault()">LinkedIn</a>
                    <a href="#" (click)="$event.preventDefault()">GitHub</a>
                    <a href="#" (click)="$event.preventDefault()">Twitter</a>
                </div>
            </div>

            <form class="contact-form" (submit)="$event.preventDefault()">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Your message..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>
</section>
