<section class="contact" id="contact">
    <div class="container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2 class="section-title left">Let's Connect</h2>
                <p class="contact-text">
                    I'm open to backend and full-stack engineering opportunities. Have a role or a
                    project in mind? Send a message and I'll get back to you.
                </p>
                <div class="contact-details">
                    <div class="detail-item">
                        <span class="icon">📧</span>
                        <a [href]="'mailto:' + email">{{ email }}</a>
                    </div>
                    <div class="detail-item">
                        <span class="icon">📍</span>
                        <span>Kerala, India</span>
                    </div>
                </div>
                <div class="socials">
                    <a href="https://linkedin.com/in/mohamed3shamil" target="_blank" rel="noopener">LinkedIn</a>
                    <a href="https://github.com/mohamed3shamil" target="_blank" rel="noopener">GitHub</a>
                </div>
            </div>

            <form class="contact-form"
                (submit)="onSubmit($event, nameInput.value, emailInput.value, messageInput.value)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" #nameInput placeholder="Your name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" #emailInput placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" #messageInput placeholder="Your message..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>
</section>
