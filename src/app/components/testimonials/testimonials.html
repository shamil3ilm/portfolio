@if (hasTestimonials) {
<section class="testimonials" id="testimonials">
    <div class="container">
        <div class="testimonials-head" appReveal>
            <span class="eyebrow">In their words</span>
            <h2 class="section-title">What clients have said.</h2>
        </div>

        <div class="quote-grid">
            @for (t of testimonials; track t.author; let idx = $index) {
            <figure class="quote-card" appReveal [revealDelay]="idx * 100">
                <svg class="quote-mark" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"
                    aria-hidden="true">
                    <path d="M9.5 4A5.5 5.5 0 004 9.5v6A2.5 2.5 0 006.5 18h1A2.5 2.5 0 0010 15.5v-1A2.5 2.5 0 007.5 12H6v-2.5A3.5 3.5 0 019.5 6a1 1 0 000-2zm10 0a5.5 5.5 0 00-5.5 5.5v6A2.5 2.5 0 0016.5 18h1a2.5 2.5 0 002.5-2.5v-1A2.5 2.5 0 0017.5 12H16v-2.5A3.5 3.5 0 0119.5 6a1 1 0 000-2z" />
                </svg>
                <blockquote>
                    <p>{{ t.quote }}</p>
                </blockquote>
                <figcaption>
                    <span class="author">{{ t.author }}</span>
                    <span class="role">
                        {{ t.role }}@if (t.company) {, <span class="company">{{ t.company }}</span>}
                    </span>
                </figcaption>
            </figure>
            }
        </div>
    </div>
</section>
}
